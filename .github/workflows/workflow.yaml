name: Deploy DEV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testing-changes:
    runs-on: ubuntu-latest
    name: Build/Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  deploy-env:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: testing-changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy using sls
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEFAULT_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEFAULT_SECRET }}
          AWS_REGION: us-east-1
        run: npx sls deploy

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v1
        with:
          message: |
            Your SLS App was deployed!
            Awesome :D
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}